name: Sign up and create your first project
description: Walks through account creation and creating a first project in the Acme seed app.
baseUrl: http://localhost:4321
viewport:
  width: 1280
  height: 800
defaults:
  typeCadence: human
  mousePace: natural
  # Pacing knobs (milliseconds). These are the calibrated, unhurried defaults,
  # shown explicitly so they're easy to tune per demo.
  preActionDwell: 450 # beat after the cursor arrives on a target, before it acts
  postActionHold: 650 # beat after a click/type so the result stays readable
  readPause: 900 # reading pause after each navigation (goto or client-side)
  # Global pace multiplier: 1 = these defaults, >1 plays faster, <1 slower.
  # Scales every dwell/hold/reading pause and the mouse-travel & typing durations.
  speed: 1.0
  # Post-production zoom (applied by the compositor). `level` is the max
  # magnification for activity-driven zooms (1 = no zoom).
  zoom:
    level: 1.25
steps:
  - goto: /
  - narrate: First, create your account
  # `zoom: in` forces a single sustained zoom that holds through the whole login
  # (email → password → submit) and releases at `zoom: out`. The automatic
  # behavior already merges these, but the explicit markers make it deliberate.
  - zoom: in
  - type:
      target: { role: textbox, name: Email }
      text: demo@acme.com
  - type:
      target: { role: textbox, name: Password }
      text: hunter2demo
  - click:
      target: { role: button, name: Create account }
  - zoom: out
  - waitFor:
      target: { text: Welcome to Acme }
  - narrate: Now let's create your first project
  - click:
      target: { role: button, name: New Project }
  - type:
      target: { role: textbox, name: Project name }
      text: Marketing site
  - click:
      target: { role: button, name: Create }
  - waitFor:
      target: { text: Marketing site }
  - pause: 800
