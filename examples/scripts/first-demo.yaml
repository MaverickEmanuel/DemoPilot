name: Sign up and create your first project
description: Walks through account creation and creating a first project in the Acme seed app.
baseUrl: http://localhost:4321
viewport:
  width: 1280
  height: 800
# This demo intentionally declares NO `defaults:` block — it runs entirely on
# DemoPilot's built-in, content-agnostic defaults: typing/mouse pace, the
# reading/hold pauses, and the whole auto-zoom camera (adaptive depth, gentle
# establishing pull-backs that stay in the app context, light motion blur, and
# the crisp outro landing). Those same defaults apply to ANY app's demo, so this
# example doubles as a check that the defaults look good unaided. To tune a
# specific demo, add a `defaults:` block, e.g.:
#   defaults:
#     speed: 1.2
#     postActionHold: 800
#     zoom: { minZoom: 1.1, maxZoom: 1.7 }
steps:
  - goto: /
  - narrate: First, create your account
  # An explicit action group holds ONE anchor across the whole sign-in
  # (email → password → submit) — the camera never punches per click and never
  # pumps between fields. The container heuristic would group these anyway, but
  # the marker makes it deliberate and names the action.
  - group: { name: Sign in }
  - type:
      target: { role: textbox, name: Email }
      text: demo@acme.com
  - type:
      target: { role: textbox, name: Password }
      text: hunter2demo
  - click:
      target: { role: button, name: Create account }
  - group: end
  - waitFor:
      target: { text: Welcome to Acme }
  - narrate: Now let's create your first project
  # No explicit group here: the camera groups automatically. The "New Project"
  # button (header) and the modal form live in different containers, so they
  # become two shots — the camera punches the button, then pans into the form.
  - click:
      target: { role: button, name: New Project }
  - type:
      target: { role: textbox, name: Project name }
      text: Marketing site
  - click:
      target: { role: button, name: Create }
  - waitFor:
      target: { text: Marketing site }
  - pause: 400
