name: Sign up and create your first project
description: Walks through account creation and creating a first project in the Acme seed app.
baseUrl: http://localhost:4321
viewport:
  width: 1280
  height: 800
# This demo runs almost entirely on DemoPilot's built-in, content-agnostic
# defaults (typing/mouse pace, reading/hold pauses, adaptive-depth auto-zoom,
# light motion blur, full zoom-out outro) — so it doubles as a check that the
# defaults look good unaided. The one `defaults:` override below softens the
# camera spring: with the stock snappier spring, the two back-to-back shot
# changes around the sign-in → "New Project" → project-name beat land quickly
# and then sit, which reads as abrupt. A gentler spring (plus a shallower
# navigation dip) lets the zoom *ease* between shots and take its time.
defaults:
  zoom:
    stiffness: 5          # softer spring — the camera eases between shots instead of snapping
    damping: 1.0          # critically damped: a smooth settle with no overshoot/bounce
    establishLevel: 1.2   # shallower navigation dip, so sign-in → project doesn't swing wide then punch back in
steps:
  - goto: /
  - narrate: First, create your account
  # An explicit action group holds ONE anchor across the whole sign-in
  # (email → password → submit) — the camera never punches per click and never
  # pumps between fields. The container heuristic would group these anyway, but
  # the marker makes it deliberate and names the action.
  - group: { name: Sign in }
  - type:
      target: { role: textbox, name: Email }
      text: demo@acme.com
  - type:
      target: { role: textbox, name: Password }
      text: hunter2demo
  - click:
      target: { role: button, name: Create account }
  - group: end
  - waitFor:
      target: { text: Welcome to Acme }
  - narrate: Now let's create your first project
  # No explicit group here: the camera groups automatically. The "New Project"
  # button (header) and the modal form live in different containers, so they
  # become two shots — the camera punches the button, then pans into the form.
  - click:
      target: { role: button, name: New Project }
  - type:
      target: { role: textbox, name: Project name }
      text: Marketing site
  - click:
      target: { role: button, name: Create }
  - waitFor:
      target: { text: Marketing site }
  - pause: 400
