name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The official Playwright image ships browsers + system deps preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests (incl. player e2e)
        run: pnpm test

      - name: End-to-end render smoke
        run: pnpm render:example

      - name: Upload rendered demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-render
          path: renders/first-demo.mp4
          if-no-files-found: ignore
